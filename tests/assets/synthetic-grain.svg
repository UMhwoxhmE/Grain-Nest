<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="600" height="200" viewBox="0 0 600 200">

  <!-- Phase 3 detection test fixture.
       Three rectangular pieces, each in its own <g>, each with a
       grain-line element using a different one of the three detection
       rules. Grain angles 0° / 45° / 90°. -->

  <!-- Rule 1: class="grainline" (Seamly2D style). Grain horizontal. -->
  <g id="piece-seamly2d">
    <rect x="20" y="20" width="160" height="160" fill="none" stroke="#000"/>
    <line class="grainline" x1="40" y1="100" x2="160" y2="100" stroke="#888"/>
  </g>

  <!-- Rule 2: line inside a <g inkscape:label="grain">. Grain at 45° in SVG
       coordinates — the y-axis points DOWN, so a 45° grain runs down-right:
       atan2(y2-y1, x2-x1) = atan2(120,120) = 45°. (Drawn up-right it would be
       135°, the other bias direction.) -->
  <g id="piece-inkscape-group">
    <rect x="220" y="20" width="160" height="160" fill="none" stroke="#000"/>
    <g inkscape:label="grain">
      <line x1="240" y1="60" x2="360" y2="180" stroke="#888"/>
    </g>
  </g>

  <!-- Rule 3: id contains "grain". Grain vertical (90°). -->
  <g id="piece-id-grain">
    <rect x="420" y="20" width="160" height="160" fill="none" stroke="#000"/>
    <line id="grain-3" x1="500" y1="40" x2="500" y2="160" stroke="#888"/>
  </g>

</svg>
