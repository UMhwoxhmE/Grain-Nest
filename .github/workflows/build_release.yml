name: build release

# Builds Grain-Nest.app (macOS, Apple Silicon / arm64) and attaches its disk
# image (.dmg) to a GitHub release.
#
# - Publishing a release on GitHub runs this automatically for that release.
# - A manual run (Actions tab → build release → Run workflow) takes a version
#   tag, e.g. v1.1.0. If no release with that tag exists yet, it is created
#   (tag on the commit the run was started from) once the app has built, so a
#   failed build never leaves an empty release. If it exists, the disk image
#   on it is replaced.
#
# The Mac build itself lives in build.yml; this file just calls it and then
# publishes the result from a (cheaper) Linux machine.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag, e.g. v1.1.0"
        required: true
      notes:
        description: "Release notes (optional; blank = list of merged changes)"
        required: false
  release:
    types: [published]

jobs:
  build:
    # Releases come only from the public Grain-Nest repository; in the
    # private Workshop copy this does nothing (and so does the step below,
    # which needs it).
    if: github.repository == 'UMhwoxhmE/Grain-Nest'
    uses: ./.github/workflows/build.yml

  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grain-nest-macos-arm64

      - name: Create the release if it doesn't exist yet
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing its disk image."
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Grain-Nest $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Grain-Nest $TAG" --generate-notes
          fi

      - name: Attach the Grain-Nest disk image to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" grain-nest-v*-macos-arm64.dmg --clobber --repo "$GITHUB_REPOSITORY"
